[project]
name = "hass-person-tracker"
version = "0.1.0"
description = "Track household members' locations via camera detections and AI Task identification."
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["testing_config", ".git", ".venv"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 88
