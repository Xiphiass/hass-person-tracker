name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.0"
      - name: Install dependencies
        run: |
          uv venv
          # pytest-homeassistant-custom-component pins homeassistant==2026.10.2
          # and brings the test harness; the rest are requirements of the HA
          # components the tests set up (ai_task, conversation, http, ...).
          uv pip install pytest-homeassistant-custom-component==0.13.373 PyTurboJPEG==1.8.3 av==19.0.0 paho-mqtt hassil gazetteer-matcher home-assistant-intents
      - name: Check formatting
        run: uvx black --check .
      - name: Run tests
        run: .venv/bin/pytest
